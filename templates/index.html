<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شنو تنشاهد اليوم؟</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 شنو تنشاهد اليوم؟</h1>
            <p>اكتشف الفيلم أو المسلسل المناسب لك في ثوانٍ معدودة</p>
        </header>

        <form action="/recommend" method="POST" class="quiz-form">
            <div class="form-group">
                <label>1. شنو فبالك تشوف؟</label>
                <select name="type">
                    <option value="Any">أي حاجة (فاجئني)</option>
                    <option value="Movie">فيلم</option>
                    <option value="Series">مسلسل</option>
                </select>
            </div>

            <div class="form-group">
                <label>2. اختر النوع المفضّل:</label>
                <select name="genre">
                    <option value="Any">جميع الأنواع</option>
                    <option value="Sci-Fi">خيال علمي</option>
                    <option value="Comedy">كوميديا</option>
                    <option value="Drama">دراما</option>
                    <option value="Fantasy">خيال</option>
                    <option value="Mystery">غموض</option>
                </select>
            </div>

            <div class="form-group">
                <label>3. شنو هو الجو العام اللي كتقلب عليه؟</label>
                <select name="mood">
                    <option value="Any">أي جو</option>
                    <option value="Mind-bending">معقد وفلسفي 🤯</option>
                    <option value="Fun">ممتع ومريح 😄</option>
                    <option value="Intense">حماسي ومشوق ⚡</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">🎲 اعطيني اقتراح</button>
        </form>
    </div>
</body>
</html>
